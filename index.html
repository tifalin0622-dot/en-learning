<!DOCTYPE html>

    <!-- ==================== 分頁一：單字與日常例句庫 ==================== -->

  <script>
    // ==================== 1. 預設資料與常數 ====================
    const STORAGE_KEY_VOCAB = 'linguaflow_vocab_html_v1';
    const STORAGE_KEY_API = 'linguaflow_gemini_api_key';

    const INITIAL_VOCAB = [
      {

        term: 'oversight',

        cefr: 'C1',

        sourceContext: 'A small oversight that cost me another sandwich.',
        timestamp: '00:06:08',
        dailyExample: 'Leaving the attachment off the email was an honest oversight.',
        sourceTitle: 'English Podcast: Daily Life & Routines',
        sourceUrl: 'https://youtu.be/YZd7NodhcOs',
        mastered: false,
        createdAt: 1700000005000
      },
      {
        id: 'v2',
        term: 'unattended',
        phonetic: '/ˌʌnəˈtendɪd/',

        partOfSpeech: 'adj.',

        timestamp: '00:20:05',
        dailyExample: 'Never leave your luggage unattended at the train station.',
        sourceTitle: 'English Podcast: Daily Life & Routines',
        sourceUrl: 'https://youtu.be/YZd7NodhcOs',
        mastered: false,
        createdAt: 1700000004000
      },
      {
        id: 'v3',
        term: 'run errands',
        phonetic: '/rʌn ˈerəndz/',
        cefr: 'B1',
        partOfSpeech: 'phrase',
        definitionZh: '辦雜事、出門跑腿（採買、寄件等）',
        sourceContext: "I'm stopping by your mom's after work right, and I've got another errand.",
        timestamp: '00:15:11',
        dailyExample: 'I spent the entire Saturday morning running errands around town.',
        sourceTitle: 'English Podcast: Daily Life & Routines',
        sourceUrl: 'https://youtu.be/YZd7NodhcOs',
        mastered: false,
        createdAt: 1700000003000
      },
      {
        id: 'v4',
        term: 'put off',
        phonetic: '/pʊt ɔːf/',
        cefr: 'B2',
        partOfSpeech: 'phrasal verb',
        definitionZh: '拖延、推遲',
        sourceContext: 'Yesterday I had a call to make, but I kept putting it off because I thought it would take ages.',
        timestamp: '00:11:46',
        dailyExample: "Don't put off until tomorrow what you can finish today.",
        sourceTitle: 'English Podcast: Daily Life & Routines',
        sourceUrl: 'https://youtu.be/YZd7NodhcOs',
        mastered: false,
        createdAt: 1700000002000
      },
      {
        id: 'v5',
        term: 'call it a day',
        phonetic: '/kɔːl ɪt ə deɪ/',
        cefr: 'B2',
        partOfSpeech: 'idiom',
        definitionZh: '收工、結束今天的工作',
        sourceContext: 'I finished the report though, then I called it a day and went home.',
        timestamp: '00:14:58',
        dailyExample: "We've made great progress on the presentation; let's call it a day.",
        sourceTitle: 'English Podcast: Daily Life & Routines',
        sourceUrl: 'https://youtu.be/YZd7NodhcOs',
        mastered: false,
        createdAt: 1700000001000
      }
    ];

    const SAMPLE_ARTICLE_TEXT = `When trying to build sustainable daily habits, many people inadvertently fall into the trap of perfectionism. Instead of taking incremental steps, they overhaul their entire schedule overnight, which often leads to burnout within a few weeks. Behavioural researchers suggest that friction plays a pivotal role: if you want to read more before bed, leave a book on your pillow so it is effortless to pick up. Conversely, making distracting apps slightly harder to access can curb mindless scrolling.`;

    // ==================== 2. 應用程式狀態管理 ====================
    const state = {
      activeTab: 'cards', // 'cards' | 'shadowing' | 'import'
      vocabList: loadVocabFromStorage(),
      filterLevel: 'ALL',
      filterSource: 'ALL',
      learningStatusFilter: 'learning', // 'learning' | 'mastered' | 'all'
      searchQuery: '',
      voiceGender: 'female', // 'female' | 'male'
      isLoadingAudio: false,
      isSpeaking: false,
      speakingTextId: null,
      // 復讀練習室
      currentIndex: 0,
      practiceTarget: 'dailyExample', // 'dailyExample' | 'sourceContext'
      speechRate: 1.0,
      isLooping: false,
      isRecording: false,
      spokenText: '',
      pronunciationScore: null,
      speechError: '',
      // API 金鑰
      geminiApiKey: localStorage.getItem(STORAGE_KEY_API) || ''
    };

    let currentAudio = null;
    const audioCache = {};
    let loopTimer = null;
    let recognition = null;
    let toastTimer = null;

    function loadVocabFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_VOCAB);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {
        console.error('讀取本機單字庫失敗:', e);
      }
      return [...INITIAL_VOCAB];
    }

    function saveVocabToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(state.vocabList));
      } catch (e) {
        console.error('寫入本機單字庫失敗:', e);
      }
    }

    // ==================== 3. 工具函式 ====================
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getLevelBadgeStyle(level) {
      switch (level) {
        case 'B1':
          return 'bg-[#D8F3DC] text-[#2D6A4F] border-[#B7E4C7]';
        case 'B2':
          return 'bg-[#FFF3B0] text-[#7F5539] border-[#FFE6A7]';
        case 'C1':
          return 'bg-[#FFD6BA] text-[#9C4221] border-[#FFCAD4]';
        default:
          return 'bg-stone-100 text-stone-700 border-stone-200';
      }
    }

    function getShadowingPool() {
      const unmastered = state.vocabList.filter(v => !v.mastered);
      return unmastered.length > 0 ? unmastered : state.vocabList;
    }

    function pcm16Base64ToWavUrl(base64Data, sampleRate = 24000) {
      const binaryString = atob(base64Data);
      const pcmLength = binaryString.length;
      const wavBuffer = new ArrayBuffer(44 + pcmLength);
      const view = new DataView(wavBuffer);

      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + pcmLength, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, pcmLength, true);

      const bytes = new Uint8Array(wavBuffer, 44);
      for (let i = 0; i < pcmLength; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      const blob = new Blob([wavBuffer], { type: 'audio/wav' });
      return URL.createObjectURL(blob);
    }

    // 指數退避重試機制
    async function fetchWithBackoff(url, options, maxRetries = 3) {
      let delay = 1000;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          const response = await fetch(url, options);
          if (response.ok) return response;
          if (response.status === 429 || response.status >= 500) {
            if (attempt < maxRetries) {
              await new Promise(res => setTimeout(res, delay));
              delay *= 2;
              continue;
            }
          }
          return response;
        } catch (err) {
          if (attempt < maxRetries) {
            await new Promise(res => setTimeout(res, delay));
            delay *= 2;
            continue;
          }
          throw err;
        }
      }
    }

    // ==================== 4. 語音朗讀與跟讀引擎 ====================
    function stopAllAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      state.isSpeaking = false;
      state.speakingTextId = null;
      refreshAudioUI();
    }

    function fallbackBrowserSpeak(text, rate, onEndCallback) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = rate;
      const voices = window.speechSynthesis.getVoices();
      const enVoices = voices.filter(v => v.lang.startsWith('en'));
      if (enVoices.length > 0) {
        const preferred = enVoices.find(v =>
          state.voiceGender === 'female'
            ? /female|samantha|victoria|zira|google us english/i.test(v.name)
            : /male|daniel|alex|david|guy/i.test(v.name)
        );
        if (preferred) utterance.voice = preferred;
      }
      utterance.onstart = () => {
        state.isSpeaking = true;
        refreshAudioUI();
      };
      utterance.onend = () => {
        state.isSpeaking = false;
        state.speakingTextId = null;
        refreshAudioUI();
        if (onEndCallback) onEndCallback();
      };
      utterance.onerror = () => {
        state.isSpeaking = false;
        state.speakingTextId = null;
        refreshAudioUI();
      };
      window.speechSynthesis.speak(utterance);
    }

    async function speakText(text, rate = 1.0, onEndCallback = null, textId = null) {
      if (textId && state.speakingTextId === textId && state.isSpeaking) {
        stopAllAudio();
        return;
      }
      stopAllAudio();
      if (textId) state.speakingTextId = textId;

      const voiceName = state.voiceGender === 'female' ? 'Aoede' : 'Puck';
      const cacheKey = `${voiceName}::${text}`;

      const playWavUrl = (url) => {
        const audio = new Audio(url);
        audio.playbackRate = rate;
        currentAudio = audio;
        audio.onplay = () => {
          state.isSpeaking = true;
          refreshAudioUI();
        };
        audio.onended = () => {
          state.isSpeaking = false;
          state.speakingTextId = null;
          refreshAudioUI();
          if (onEndCallback) onEndCallback();
        };
        audio.onerror = () => {
          state.isSpeaking = false;
          state.speakingTextId = null;
          refreshAudioUI();
        };
        audio.play().catch(() => {
          fallbackBrowserSpeak(text, rate, onEndCallback);
        });
      };

      if (audioCache[cacheKey]) {
        playWavUrl(audioCache[cacheKey]);
        return;
      }

      state.isLoadingAudio = true;
      refreshAudioUI();

      try {
        const apiKey = state.geminiApiKey || '';
        const response = await fetchWithBackoff(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `Say naturally and clearly: ${text}` }] }],
              generationConfig: {
                responseModalities: ['AUDIO'],
                speechConfig: {
                  voiceConfig: {
                    prebuiltVoiceConfig: { voiceName }
                  }
                }
              }
            })
          }
        );

        if (!response || !response.ok) throw new Error('TTS API failed');
        const data = await response.json();
        const inlineData = data?.candidates?.[0]?.content?.parts?.[0]?.inlineData;
        if (!inlineData?.data) throw new Error('No audio payload');

        const rateMatch = inlineData.mimeType?.match(/rate=(\d+)/);
        const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
        const wavUrl = pcm16Base64ToWavUrl(inlineData.data, sampleRate);
        audioCache[cacheKey] = wavUrl;
        state.isLoadingAudio = false;
        playWavUrl(wavUrl);
      } catch (err) {
        state.isLoadingAudio = false;
        refreshAudioUI();
        fallbackBrowserSpeak(text, rate, onEndCallback);
      }
    }

    function refreshAudioUI() {

    // ==================== 6. 復讀練習室控制 ====================
    function changeShadowIndex(delta) {
      const pool = getShadowingPool();
      if (pool.length === 0) return;
      state.isLooping = false;
      if (loopTimer) clearTimeout(loopTimer);
      stopAllAudio();
      state.spokenText = '';
      state.pronunciationScore = null;
      state.speechError = '';
      state.currentIndex = (state.currentIndex + delta + pool.length) % pool.length;
      renderShadowingTab();
    }

    function setPracticeTarget(target) {
      state.practiceTarget = target;
      state.isLooping = false;
      if (loopTimer) clearTimeout(loopTimer);
      stopAllAudio();
      state.spokenText = '';
      state.pronunciationScore = null;
      state.speechError = '';
      renderShadowingTab();
    }

    function setSpeechRate(rate) {
      state.speechRate = rate;
      renderShadowingTab();
    }

    function toggleLooping() {
      state.isLooping = !state.isLooping;
      if (loopTimer) clearTimeout(loopTimer);

      if (!state.isLooping) {
        stopAllAudio();
        renderShadowingTab();
        return;
      }

      const pool = getShadowingPool();
      const item = pool[state.currentIndex % pool.length];
      if (!item) return;

      const triggerLoop = () => {
        if (!state.isLooping || state.activeTab !== 'shadowing') return;
        speakText(
          item[state.practiceTarget],
          state.speechRate,
          () => {
            if (state.isLooping && state.activeTab === 'shadowing') {
              loopTimer = setTimeout(triggerLoop, 1200);
            }
          },
          'shadow-main'
        );
      };

      renderShadowingTab();
      triggerLoop();
    }

    function toggleRecording() {
      state.speechError = '';
      if (state.isRecording) {
        if (recognition) recognition.stop();
        state.isRecording = false;
        renderShadowingTab();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        state.speechError = '您的瀏覽器尚未支援原生語音辨識，建議使用 Chrome 或 Edge 瀏覽器進行跟讀評分。';
        renderShadowingTab();
        return;
      }

      state.isLooping = false;
      if (loopTimer) clearTimeout(loopTimer);
      stopAllAudio();

      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => {
        state.isRecording = true;
        state.spokenText = '';
        state.pronunciationScore = null;
        renderShadowingTab();
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        state.spokenText = transcript;

        if (event.results[event.results.length - 1].isFinal) {
          const pool = getShadowingPool();
          const item = pool[state.currentIndex % pool.length];
          if (item) {
            calculateAccuracy(item[state.practiceTarget], transcript);
          }
        }
        renderShadowingTab();
      };

      recognition.onerror = (event) => {
        state.isRecording = false;
        state.speechError = `麥克風辨識提示：${event.error === 'not-allowed' ? '請允許瀏覽器使用麥克風權限' : '未偵測到清晰語音，請再試一次'}`;
        renderShadowingTab();
      };

      recognition.onend = () => {
        state.isRecording = false;
        renderShadowingTab();
      };

      recognition.start();
    }

    function calculateAccuracy(target, spoken) {
      const clean = (str) => str.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/).filter(Boolean);
      const targetWords = clean(target);
      const spokenWords = clean(spoken);
      if (targetWords.length === 0) return;

      let matchCount = 0;
      targetWords.forEach(w => {
        if (spokenWords.includes(w)) matchCount++;
      });

      state.pronunciationScore = Math.min(100, Math.round((matchCount / targetWords.length) * 100));
    }

    function buildDiffHtml(target, spoken) {
      if (!spoken) return '';
      const spokenClean = spoken.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/);
      return target.split(/\s+/).map(word => {
        const cleanWord = word.toLowerCase().replace(/[^\w]/g, '');
        const isMatch = spokenClean.includes(cleanWord);
        return `<span class="inline-block mr-1.5 px-1.5 py-0.5 rounded-lg ${
          isMatch
            ? 'text-[#2D6A4F] bg-[#D8F3DC] font-semibold'
            : 'text-[#9B2226] bg-[#FFCCD5] underline decoration-wavy'
        }">${escapeHtml(word)}</span>`;
      }).join('');
    }

    // 鍵盤快捷鍵
    window.addEventListener('keydown', (e) => {
      if (state.activeTab !== 'shadowing') return;
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
      if (e.code === 'Space') {
        e.preventDefault();
        const pool = getShadowingPool();
        const item = pool[state.currentIndex % pool.length];
        if (item) speakText(item[state.practiceTarget], state.speechRate, null, 'shadow-main');
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        changeShadowIndex(1);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        changeShadowIndex(-1);
      }
    });

    // 自動從連結讀取網頁或 YouTube 影片文字內容（支援純前端免後端抓取）
    async function fetchContentFromUrl(url) {
      // 1. 優先透過 Jina Reader 免費純文字提取服務抓取網頁/影片公開文字內容
      try {
        const readerUrl = `https://r.jina.ai/${url}`;
        const res = await fetch(readerUrl, {
          headers: { 'Accept': 'text/plain' }
        });
        if (res.ok) {
          const text = await res.text();
          // 過濾過短或無效的錯誤頁面，限制長度在 12,000 字元內避免超過 token 上限
          if (text && text.trim().length > 120) {
            return text.trim().slice(0, 12000);
          }
        }
      } catch (e) {
        console.warn('Jina Reader 抓取失敗，嘗試備援方案:', e);
      }

      // 2. 若為 YouTube 連結且上方受阻，透過 noembed 取得影片標題與頻道資訊作為語境提示
      if (/youtu\.?be/i.test(url)) {
        try {
          const oembedRes = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
          if (oembedRes.ok) {
            const info = await oembedRes.json();
            if (info && info.title) {
              return `YouTube Video Title: "${info.title}" by ${info.author_name || 'Creator'}. Video URL: ${url}. Please infer the core B1-C1 English vocabulary, phrasal verbs, and natural expressions commonly discussed in a video with this exact title and topic.`;
            }
          }
        } catch (e) {
          console.warn('YouTube oEmbed 備援失敗:', e);
        }
      }

      return '';
    }

    async function handleAnalyzeContent() {
      const inputUrl = document.getElementById('import-url').value.trim();
      let contentToAnalyze = document.getElementById('import-text').value.trim();
      const statusBox = document.getElementById('analyze-status-box');
      const btnAnalyze = document.getElementById('btn-analyze');

      // 只要「網址」或「文章內容」其中一個有填寫即可！
      if (!inputUrl && !contentToAnalyze) {
        statusBox.className = 'p-4 rounded-2xl text-sm flex items-start gap-2.5 bg-[#FFF0F3] text-[#9B2226] border border-[#FFCCD5]';
        statusBox.innerHTML = `<i data-lucide="alert-circle" class="w-5 h-5 shrink-0 text-[#E63946]"></i><span>請輸入「影片/文章連結」或「英文內文」（任填一項即可）。</span>`;
        statusBox.classList.remove('hidden');
        lucide.createIcons();
        return;
      }

      btnAnalyze.disabled = true;
      statusBox.classList.add('hidden');

      try {
        // 若使用者只貼了連結、沒貼文章內文，自動為其抓取連結內容
        if (!contentToAnalyze && inputUrl) {
          btnAnalyze.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>正在自動讀取連結內容，請稍候...</span>`;
          lucide.createIcons();

          const fetchedText = await fetchContentFromUrl(inputUrl);
          if (!fetchedText) {
            throw new Error('URL_FETCH_FAILED');
          }
          contentToAnalyze = fetchedText;
        }

        btnAnalyze.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>AI 正在分析語境並累加至單字庫...</span>`;
        lucide.createIcons();

        const apiKey = state.geminiApiKey || '';
        const prompt = `Analyze the following English content (from a video link, transcript, or article). Extract 5 to 8 useful vocabulary words, phrasal verbs, or idiomatic expressions at the CEFR B1 to C1 level. Ignore basic A1/A2 words.
For each item, provide:
- term: the word or phrase
- phonetic: standard IPA phonetic transcription (e.g. /ˈoʊvərsaɪt/)
- cefr: "B1", "B2", or "C1"
- partOfSpeech: e.g. "noun", "verb", "adj.", "phrasal verb", "idiom"
- definitionZh: concise Traditional Chinese definition
- sourceContext: a natural sentence from the text (or matching the video/article topic) containing this term
- dailyExample: a natural, practical daily conversational sentence using this term
- sourceTitle: a short 3-6 word English title summarizing this video or article's topic

Content to analyze:
"""
${contentToAnalyze}
"""`;

        const response = await fetchWithBackoff(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: {
                responseMimeType: 'application/json',
                responseSchema: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      term: { type: 'STRING' },
                      phonetic: { type: 'STRING' },
                      cefr: { type: 'STRING' },
                      partOfSpeech: { type: 'STRING' },
                      definitionZh: { type: 'STRING' },
                      sourceContext: { type: 'STRING' },
                      dailyExample: { type: 'STRING' },
                      sourceTitle: { type: 'STRING' }
                    },
                    required: ['term', 'phonetic', 'cefr', 'partOfSpeech', 'definitionZh', 'sourceContext', 'dailyExample', 'sourceTitle']
                  }
                }
              }
            })
          }
        );

        if (!response || !response.ok) {
          throw new Error(response?.status === 400 || response?.status === 403 ? 'API_KEY_INVALID' : 'API_FAILED');
        }

        const data = await response.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
        const extracted = JSON.parse(rawText);

        // 過濾重複詞彙，確保只累加新單字且保留原有單字
        const existingTerms = new Set(state.vocabList.map(v => v.term.toLowerCase().trim()));
        const uniqueNewItems = extracted.filter(item => !existingTerms.has(item.term.toLowerCase().trim()));

        const formattedNewItems = uniqueNewItems.map((item, idx) => ({
          ...item,
          id: `custom-${Date.now()}-${idx}`,
          timestamp: inputUrl.includes('youtu') ? '影片片段' : '文章段落',
          sourceTitle: item.sourceTitle || (inputUrl.includes('youtu') ? 'YouTube 匯入影片' : '匯入英文文章'),
          sourceUrl: inputUrl || '自訂貼上內容',
          mastered: false,
          createdAt: Date.now() - idx
        }));

        state.vocabList = [...formattedNewItems, ...state.vocabList];
        saveVocabToStorage();

        const skippedCount = extracted.length - formattedNewItems.length;
        statusBox.className = 'p-4 rounded-2xl text-sm flex items-start gap-2.5 bg-[#EAF8F0] text-[#2D6A4F] border border-[#B7E4C7]';
        statusBox.innerHTML = `<i data-lucide="check-circle-2" class="w-5 h-5 shrink-0 text-[#3D8B6B]"></i><span>${
          formattedNewItems.length > 0
            ? `成功新增 <strong>${formattedNewItems.length}</strong> 個 B1–C1 新單字並累加至單字庫！（累計共 <strong>${state.vocabList.length}</strong> 個單字${skippedCount > 0 ? `，已自動略過 ${skippedCount} 個重複詞彙` : ''}）`
            : `分析完成，這段內容的 ${extracted.length} 個核心單字都已經在你的單字庫裡囉！`
        }</span>`;
        statusBox.classList.remove('hidden');
        document.getElementById('import-text').value = '';
        document.getElementById('import-url').value = '';

        renderAll();
        if (formattedNewItems.length > 0) {
          state.learningStatusFilter = 'learning';
          state.filterSource = 'ALL';
          setTimeout(() => switchTab('cards'), 1200);
        }
      } catch (err) {
        console.error(err);
        let msg = '智慧解析時發生連線錯誤，請確認網路或 API Key 設定後再試一次。';
        if (err.message === 'API_KEY_INVALID') {
          msg = '請先點擊右上角「API 設定」填入有效的 Google Gemini API Key，即可使用 AI 智慧萃取功能。';
        } else if (err.message === 'URL_FETCH_FAILED') {
          msg = '此網站或影片設有防爬蟲保護無法自動讀取，請改為直接複製文章段落或字幕貼入下方欄位即可！';

      } finally {
        btnAnalyze.disabled = false;
        btnAnalyze.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i><span>萃取出單字並累加到我的單字庫</span>`;

                  state.isRecording
                    ? 'bg-[#FF8FA3] text-white scale-110 ring-4 ring-[#FFCCD5] animate-pulse'
                    : 'bg-gradient-to-br from-[#74D3AE] to-[#52B788] hover:from-[#52B788] hover:to-[#40916C] text-white'
                }"
              >
                <i data-lucide="${state.isRecording ? 'mic-off' : 'mic'}" class="w-7 h-7"></i>
              </button>
              <p class="text-xs text-stone-500">
                ${state.isRecording ? '正在聆聽您的發音... 唸完請再次點擊停止' : '點擊麥克風開始跟讀整句英文'}
              </p>
            </div>

            ${state.speechError ? `
              <div class="p-3 rounded-2xl bg-[#FFF0F3] border border-[#FFCCD5] text-[#9B2226] text-xs flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span>${escapeHtml(state.speechError)}</span>
              </div>
            ` : ''}

            ${(state.spokenText || state.pronunciationScore !== null) ? `
              <div class="bg-[#F9F8F4] rounded-3xl p-5 border border-[#EAE6DC] space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold text-stone-500">您的跟讀辨識結果：</span>
                  ${state.pronunciationScore !== null ? `
                    <span class="inline-flex items-center gap-1 text-xs font-bold px-2.5 py-1 rounded-full ${
                      state.pronunciationScore >= 80 ? 'bg-[#D8F3DC] text-[#2D6A4F]' : 'bg-[#FFF3B0] text-[#7F5539]'
                    }">
                      <i data-lucide="award" class="w-3.5 h-3.5"></i>
                      <span>精準度：${state.pronunciationScore}%</span>
                    </span>
                  ` : ''}
                </div>
                <p class="text-base text-stone-800 bg-white p-3 rounded-2xl border border-[#EAE6DC]">
                  "${escapeHtml(state.spokenText)}"
                </p>
                <div class="text-xs text-stone-500">
                  <span class="font-semibold block mb-1">逐字比對檢視（薄荷綠為準確，草莓粉為漏讀或發音偏差）：</span>
                  <div class="p-2.5 bg-white rounded-2xl border border-[#EAE6DC] text-sm leading-relaxed">
                    ${buildDiffHtml(targetSentence, state.spokenText)}
                  </div>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function renderAll() {
      updateApiStatusBadge();
      renderStatsDashboard();
      renderFilterBars();
      renderCardsGrid();
      if (state.activeTab === 'shadowing') {
        renderShadowingTab();
      }
      lucide.createIcons();
    }

    // 初始化渲染
    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
    });
  </script>
</body>
</html>
